<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriLeaf</title>
<style>
:root{--ink:#1d2a2e;--mute:#5d6e73;--bg:#f3f6f7;--line:#cdd8db;--ok:#1f6f5c;--okbg:#e2f1ec;--bad:#c2371d;--badbg:#fbe5e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:2rem;margin:0}p.sub{margin:4px 0 20px;color:var(--mute);max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:24px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:600;margin-bottom:6px}
.rec{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.rec span{width:1.4rem;color:var(--mute);text-align:right}
.rec input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff;color:var(--ink)}
.rec input.bad{border-color:var(--bad);background:var(--badbg)}
button{font:inherit;padding:8px 14px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;margin-top:8px}
button:focus-visible,input:focus-visible{outline:3px solid #2b7fff;outline-offset:1px}
#status{padding:10px 14px;border-radius:4px;margin-bottom:14px;font-weight:600}
#status.ok{background:var(--okbg);color:var(--ok)}#status.bad{background:var(--badbg);color:var(--bad)}
.tree{overflow-x:auto}.row{display:flex;justify-content:space-around;gap:6px;margin-bottom:10px;min-width:640px}
.node{flex:1;min-width:0;text-align:center;font:12px ui-monospace,monospace;padding:6px 2px;border:1.5px solid var(--ok);background:var(--okbg);color:var(--ok);border-radius:4px}
.node.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad);font-weight:700}
.tag{display:block;font:11px ui-sans-serif,system-ui;color:var(--mute)}
.rec button.rm{margin:0;padding:4px 9px;background:#fff;color:var(--bad);border-color:var(--line)}
</style></head><body><main>
<h1>VeriLeaf</h1>
<p class="sub">Each record is a leaf of a Merkle tree. Seal the records, then edit one: the changed hashes turn red from that leaf up to the root, which shows exactly where the tampering is.</p>
<div class="grid">
<section><label>Certificates</label><div id="recs"></div>
<button id="add" style="background:#fff;color:var(--ink)">Add certificate</button>
<button id="seal">Seal records</button> <button id="reset" style="background:#fff;color:var(--ink)">Reset</button></section>
<section><div id="status" aria-live="polite"></div><div class="tree" id="tree"></div></section>
</div></main>
<script>
const ORIGINAL=["Cert 101 - Asha","Cert 102 - Ravi","Cert 103 - Meera","Cert 104 - John","Cert 105 - Priya","Cert 106 - Arun","Cert 107 - Divya","Cert 108 - Karan"];
let records=[...ORIGINAL],sealed=null;
const enc=new TextEncoder(),hex=a=>[...a].map(x=>x.toString(16).padStart(2,"0")).join("");
const H=async(p,...parts)=>new Uint8Array(await crypto.subtle.digest("SHA-256",new Uint8Array([p,...parts.flatMap(x=>[...x])])));
async function build(recs){ // same rules as merkle.py: 0 = leaf prefix, 1 = node prefix
  const lv=[await Promise.all(recs.map(r=>H(0,enc.encode(r))))];
  while(lv.at(-1).length>1){const c=lv.at(-1),n=[];
    for(let i=0;i<c.length;i+=2)n.push(i+1<c.length?await H(1,c[i],c[i+1]):c[i]);lv.push(n);}
  return lv.map(l=>l.map(hex));
}
</script>

<script>
async function render(){
  const now=await build(records);
  const tree=document.getElementById("tree");tree.innerHTML="";
  const changedLeaves=[];
  for(let k=now.length-1;k>=0;k--){
    const row=document.createElement("div");row.className="row";
    now[k].forEach((h,j)=>{
      const bad=(sealed[k]?.[j])!==h;if(bad&&k===0)changedLeaves.push(j);
      const d=document.createElement("div");d.className="node"+(bad?" bad":"");
      d.innerHTML=h.slice(0,6)+(k===now.length-1?'<span class="tag">root</span>':k===0?'<span class="tag">record '+(j+1)+'</span>':"");
      row.appendChild(d);});
    tree.appendChild(row);}
  document.querySelectorAll("#recs input").forEach((el,i)=>el.classList.toggle("bad",changedLeaves.includes(i)));
  const s=document.getElementById("status"),sizeChanged=records.length!==sealed[0].length;
  if(!changedLeaves.length&&!sizeChanged){s.className="ok";s.textContent="Root matches the sealed root. No tampering detected.";}
  else{s.className="bad";
    s.textContent="Root mismatch. "+(sizeChanged?"Record count changed ("+sealed[0].length+" sealed, "+records.length+" now); records after an added or removed one shift position. ":"")
      +(changedLeaves.length?"Different from sealed: "+changedLeaves.map(i=>"record "+(i+1)).join(", ")+".":"");}
}
function inputs(){
  const box=document.getElementById("recs");box.innerHTML="";
  records.forEach((r,i)=>{const d=document.createElement("div");d.className="rec";
    d.innerHTML='<span>'+(i+1)+'</span><input aria-label="Record '+(i+1)+'"><button class="rm" aria-label="Remove record '+(i+1)+'">✕</button>';
    const inp=d.querySelector("input");inp.value=r;inp.oninput=()=>{records[i]=inp.value;render();};
    d.querySelector(".rm").onclick=()=>{if(records.length>1){records.splice(i,1);inputs();render();}};
    box.appendChild(d);});
}
document.getElementById("add").onclick=()=>{records.push("Cert "+(101+records.length)+" - New");inputs();render();};
document.getElementById("seal").onclick=async()=>{sealed=await build(records);render();};
document.getElementById("reset").onclick=async()=>{records=[...ORIGINAL];inputs();sealed=await build(records);render();};
(async()=>{inputs();sealed=await build(records);render();})();
</script></body></html>
